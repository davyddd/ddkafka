name: Quality Assurance

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality-assurance:
        uses: davyddd/dd-lib-stub/.github/workflows/quality_assurance.yml@v0.0.13
        with:
            test-matrix: '{"python-version": ["3.11", "3.12", "3.13", "3.14", "3.15"], "aiokafka": ["aiokafka<0.13", "aiokafka<0.14", "aiokafka<0.15", "aiokafka<0.16"], "exclude": [{"python-version": "3.14", "aiokafka": "aiokafka<0.13"}, {"python-version": "3.15", "aiokafka": "aiokafka<0.13"}, {"python-version": "3.15", "aiokafka": "aiokafka<0.14"}, {"python-version": "3.15", "aiokafka": "aiokafka<0.15"}]}'
            default-python-version: '3.15'
        secrets: inherit
