[project]
name = "ddkafka"
description = "Kafka helpers: batch consumer, lock-guarded consumer maker and msgpack producer on top of aiokafka"
version = "0.1.3"
authors = [{ name = "davyddd" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<3.16"
keywords = ["python", "ddkafka", "kafka", "aiokafka", "asyncio", "event streaming", "events", "producer", "consumer", "batch consumer", "partition", "consumer group", "at-least-once", "msgpack", "dsn"]
# uv_build does not derive these from requires-python (poetry did); PyPI and the pyversions badge read them
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "aiokafka>=0.12,<0.16",
    "msgpack>=1.0,<2",
    "ddutils>=0.4.0,<0.5.0",
    "pydantic>=2.10,<3",  # `_BaseMultiHostUrl` behind KafkaDsn
]

[project.urls]
Repository = "https://github.com/davyddd/ddkafka"

[dependency-groups]
dev = [
    "ipdb==0.13.13",
    "ipython==9.16.1",
]
test = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "parameterized==0.9.0",
]
linter = [
    "ruff==0.15.10",
    "ty==0.0.15",
    "complexipy==8.0.1",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
